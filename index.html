<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open Research Lab.</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  :root {
    --black: #0a0a0a;
    --white: #f5f5f2;
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--white);
    font-family: 'Share Tech Mono', monospace;
  }

  .lp {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: flex-start;
    opacity: 0;
    pointer-events: none;
  }

  .lp.active {
    opacity: 1;
    pointer-events: all;
  }

  /* ロゴ画像 */
  .logo-img {
    display: block;
    width: min(52vw, 560px);
    height: auto;
    flex-shrink: 0;
    opacity: 0;
  }

  /* メタテキスト */
  .meta {
    position: fixed;
    font-family: 'Share Tech Mono', monospace;
    font-size: clamp(9px, 0.9vw, 11px);
    color: var(--black);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0;
  }

  .lp.active .meta {
    animation: fadeUp 0.9s cubic-bezier(0.16,1,0.3,1) 0.5s forwards;
  }

  @keyframes fadeUp {
    from { opacity:0; transform: translateY(8px); }
    to   { opacity:0.38; transform: translateY(0); }
  }

  /* カーソル */
  .cursor {
    display: inline-block;
    width: 0.55em; height: 0.9em;
    background: var(--black);
    vertical-align: text-bottom;
    animation: blink 1s step-end infinite;
    margin-left: 2px;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  /* ===== ① 看板 ===== */
  #lp-sign { justify-content: flex-end; }
  #lp-sign .logo-wrap {
    position: relative;
    flex-shrink: 0;
    margin-right: min(-4vw, -40px);
    margin-top: 35vh;
  }
  #lp-sign .logo-img {
    margin-right: 0;
    margin-top: 0;
  }
  #lp-sign.active .logo-img {
    animation: fromRight 0.9s cubic-bezier(0.16,1,0.3,1) 0.05s forwards;
  }
  @keyframes fromRight {
    from { opacity:0; transform: translateX(40px); }
    to   { opacity:1; transform: translateX(0); }
  }
  #lp-sign .meta-top { top:44px; left:44px; }
  #lp-sign .meta-bot { bottom:44px; left:44px; }

  /* 鳥のコンテナ */
  #bird-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    pointer-events: none;
  }

  /* 鳥SVGのラッパー：飛んでくる動き */
  #bird-wrap {
    position: absolute;
    opacity: 0;
  }

  /* 羽ばたきアニメーション（上羽） */
  @keyframes flapUp {
    0%   { d: path('M8,10 Q4,4 0,8');   }
    50%  { d: path('M8,10 Q4,14 0,10'); }
    100% { d: path('M8,10 Q4,4 0,8');   }
  }
  /* 羽ばたきアニメーション（下羽） */
  @keyframes flapDown {
    0%   { d: path('M8,10 Q12,4 16,8');   }
    50%  { d: path('M8,10 Q12,14 16,10'); }
    100% { d: path('M8,10 Q12,4 16,8');   }
  }

  .wing-left  { animation: flapUp   0.3s ease-in-out infinite; }
  .wing-right { animation: flapDown 0.3s ease-in-out infinite; }

  /* 止まった後の首振り */
  @keyframes headTilt {
    0%   { transform: rotate(0deg);   }
    25%  { transform: rotate(15deg);  }
    50%  { transform: rotate(0deg);   }
    75%  { transform: rotate(-12deg); }
    100% { transform: rotate(0deg);   }
  }

  /* ===== ② 本 ===== */
  #lp-book { justify-content: center; }
  #lp-book .logo-img {
    margin-top: 35vh;
  }
  #lp-book.active .logo-img {
    animation: fromBelow 0.9s cubic-bezier(0.16,1,0.3,1) 0.05s forwards;
  }
  @keyframes fromBelow {
    from { opacity:0; transform: translateY(20px); }
    to   { opacity:1; transform: translateY(0); }
  }
  #lp-book .meta-top { top:44px; left:50%; transform:translateX(-50%); }
  #lp-book .meta-bot { bottom:44px; left:50%; transform:translateX(-50%); text-align:center; }

  /* ===== ③ コード ===== */
  #lp-code { justify-content: flex-start; }
  #lp-code .logo-img {
    margin-left: min(-4vw, -40px);
    margin-top: 35vh;
  }
  #lp-code.active .logo-img {
    animation: fromLeft 0.9s cubic-bezier(0.16,1,0.3,1) 0.05s forwards;
  }
  @keyframes fromLeft {
    from { opacity:0; transform: translateX(-40px); }
    to   { opacity:1; transform: translateX(0); }
  }
  #lp-code .meta-top { top:44px; right:44px; text-align:right; }
  #lp-code .meta-bot { bottom:44px; right:44px; text-align:right; }
</style>
</head>
<body>

<!-- ① 看板 -->
<div class="lp" id="lp-sign">
  <div class="logo-wrap">
    <img class="logo-img" src="logo.png" alt="Open Research Lab.">
    <!-- 鳥 -->
    <div id="bird-wrap">
      <svg id="bird-svg" width="56" height="44" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- 胴体 -->
        <ellipse id="body" cx="8" cy="11" rx="3" ry="2" fill="#0a0a0a"/>
        <!-- 尾 -->
        <polygon points="5,12 3,14 5,13" fill="#0a0a0a"/>
        <!-- 左羽 -->
        <path class="wing-left" d="M8,10 Q4,4 0,8" stroke="#0a0a0a" stroke-width="1.2" fill="none" stroke-linecap="round"/>
        <!-- 右羽 -->
        <path class="wing-right" d="M8,10 Q12,4 16,8" stroke="#0a0a0a" stroke-width="1.2" fill="none" stroke-linecap="round"/>
        <!-- 頭 -->
        <g id="bird-head">
          <circle cx="10.5" cy="8.5" r="2" fill="#0a0a0a"/>
          <!-- くちばし -->
          <polygon points="12.5,8 14.5,8.5 12.5,9" fill="#0a0a0a"/>

        </g>
        <!-- 足 -->
        <line x1="7.5" y1="13" x2="7" y2="15" stroke="#0a0a0a" stroke-width="0.8"/>
        <line x1="8.5" y1="13" x2="9" y2="15" stroke="#0a0a0a" stroke-width="0.8"/>
        <line x1="7"  y1="15" x2="6" y2="15" stroke="#0a0a0a" stroke-width="0.8"/>
        <line x1="9"  y1="15" x2="10" y2="15" stroke="#0a0a0a" stroke-width="0.8"/>
      </svg>
    </div>
  </div>
  <div class="meta meta-top">Open Research Lab. — Est. 2025</div>
  <div class="meta meta-bot">Kyushu University · Public Design</div>
</div>

<!-- ② 本 -->
<div class="lp" id="lp-book">
  <img class="logo-img" src="logo.png" alt="Open Research Lab.">
  <div class="meta meta-top">Vol. ∞</div>
  <div class="meta meta-bot">Research · Edition · Distribution</div>
</div>

<!-- ③ コーディングソフト -->
<div class="lp" id="lp-code">
  <img class="logo-img" src="logo.png" alt="Open Research Lab.">
  <div class="meta meta-top">$ open research_lab --mode=public<span class="cursor"></span></div>
  <div class="meta meta-bot">Process · Publication · Platform</div>
</div>

<script>
  // ランダムLP選択
  const lps = ['lp-sign', 'lp-book', 'lp-code'];
  const chosen = lps[Math.floor(Math.random() * lps.length)];
  document.getElementById(chosen).classList.add('active');

  // 看板LPの場合のみ鳥アニメーション
  if (chosen === 'lp-sign') {
    const logoImg  = document.querySelector('#lp-sign .logo-img');
    const birdWrap = document.getElementById('bird-wrap');
    const birdSvg  = document.getElementById('bird-svg');
    const birdHead = document.getElementById('bird-head');
    const wingL    = document.querySelector('.wing-left');
    const wingR    = document.querySelector('.wing-right');

    logoImg.addEventListener('animationend', () => {
      // ロゴの実サイズを取得してロゴ上端にスナップ
      const logoRect = logoImg.getBoundingClientRect();
      const wrapRect = logoImg.closest('.logo-wrap').getBoundingClientRect();

      // ロゴ上端の相対Y（logo-wrap基準）
      const logoTopY = logoRect.top - wrapRect.top;
      // ロゴ右端の相対X（logo-wrap基準）
      const logoRightX = logoRect.right - wrapRect.left;

      // 鳥はロゴの横幅の約30%あたりから止まる（右寄り）
      const landX = logoRightX * 0.25;
      const landY = logoTopY; // ロゴ上端

      // 鳥のSVGサイズ（表示サイズ）
      const birdW = 56;
      const birdH = 44;

      // 開始位置：画面上部の真ん中（logo-wrap基準に変換）
      const screenCenterX = window.innerWidth / 2 - wrapRect.left;
      const startX = screenCenterX;
      const startY = -wrapRect.top - birdH - 20;

      // 着地点
      const endX = landX - birdW / 2;
      const endY = landY - birdH;

      // 弧の制御点
      const cpX = (startX + endX) / 2 + (endX - startX) * 0.3;
      const cpY = (startY + endY) / 2 - 80;

      birdWrap.style.left = startX + 'px';
      birdWrap.style.top  = startY + 'px';
      birdWrap.style.opacity = '1';

      // 飛行フェーズ：二次ベジェ曲線
      const duration = 3200;
      const startTime = performance.now();

      function flyTo(now) {
        const t = Math.min((now - startTime) / duration, 1);
        const ease = 1 - Math.pow(1 - t, 2.5);
        const e = ease;
        const x = Math.pow(1-e,2)*startX + 2*(1-e)*e*cpX + Math.pow(e,2)*endX;
        const y = Math.pow(1-e,2)*startY + 2*(1-e)*e*cpY + Math.pow(e,2)*endY;
        birdWrap.style.left = x + 'px';
        birdWrap.style.top  = y + 'px';

        if (t < 1) {
          requestAnimationFrame(flyTo);
        } else {
          // 着地：羽ばたき停止
          wingL.style.animation = 'none';
          wingR.style.animation = 'none';
          // 羽を閉じた形に
          wingL.setAttribute('d', 'M8,10 Q6,10 5,11');
          wingR.setAttribute('d', 'M8,10 Q10,10 11,11');

          // 少し待ってから首振り開始
          setTimeout(() => {
            birdHead.style.transformOrigin = '10.5px 8.5px';
            birdHead.style.animation = 'headTilt 1.8s ease-in-out infinite';
          }, 400);
        }
      }

      requestAnimationFrame(flyTo);
    }, { once: true });
  }
</script>
</body>
</html>
