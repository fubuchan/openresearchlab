<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open Research Lab.</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  :root{--black:#0a0a0a;--white:#f5f5f2;--left:44px;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--white);font-family:'Share Tech Mono',ui-monospace,monospace;}
  .lp{position:absolute;inset:0;opacity:0;pointer-events:none;}
  .lp.active{opacity:1;pointer-events:all;}

  .meta{position:absolute;font-family:'Share Tech Mono',monospace;font-size:clamp(9px,0.9vw,11px);color:var(--black);letter-spacing:0.18em;text-transform:uppercase;opacity:0;}
  .lp.active .meta{animation:fadeUp 0.9s cubic-bezier(0.16,1,0.3,1) 0.5s forwards;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:0.38;transform:translateY(0);}}

  .cursor{display:inline-block;width:0.55em;height:0.9em;background:var(--black);vertical-align:text-bottom;animation:blink 1s step-end infinite;margin-left:2px;}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

  /* ナビ共通 */
  .nav{position:absolute;bottom:70px;left:60px;display:flex;flex-direction:column;gap:8px;z-index:10;}
  .nav a{font-family:'Share Tech Mono',monospace;font-size:clamp(9px,0.9vw,11px);letter-spacing:0.18em;text-transform:uppercase;color:var(--black);text-decoration:none;opacity:0;transition:opacity 0.2s ease;}
  .nav a:hover{opacity:1!important;}
  .lp.active .nav a{animation:fadeUp 0.9s cubic-bezier(0.16,1,0.3,1) forwards;}
  .lp.active .nav a:nth-child(1){animation-delay:0.5s;}
  .lp.active .nav a:nth-child(2){animation-delay:0.6s;}
  .lp.active .nav a:nth-child(3){animation-delay:0.7s;}
  .lp.active .nav a:nth-child(4){animation-delay:0.8s;}

  /* ===== ① 看板 ===== */
  #lp-sign{display:flex;align-items:flex-start;justify-content:flex-end;}
  #lp-sign .logo-wrap{position:relative;flex-shrink:0;margin-right:min(-4vw,-40px);margin-top:10vh;}
  .logo-img{display:block;width:min(48vw,520px);height:auto;flex-shrink:0;opacity:0;}
  #lp-sign .logo-img{margin:0;}
  #lp-sign.active .logo-img{animation:fromRight 0.9s cubic-bezier(0.16,1,0.3,1) 0.05s forwards;}
  @keyframes fromRight{from{opacity:0;transform:translateX(40px);}to{opacity:1;transform:translateX(0);}}
  #lp-sign .meta-top{top:44px;left:44px;}
  #bird-wrap{position:absolute;opacity:0;}
  @keyframes flapLeft{0%{transform:rotate(-35deg);}50%{transform:rotate(20deg);}100%{transform:rotate(-35deg);}}
  @keyframes flapRight{0%{transform:rotate(35deg);}50%{transform:rotate(-20deg);}100%{transform:rotate(35deg);}}
  .wing-left{transform-origin:8px 10px;animation:flapLeft 0.35s ease-in-out infinite;}
  .wing-right{transform-origin:8px 10px;animation:flapRight 0.35s ease-in-out infinite;}
  @keyframes headTilt{0%{transform:rotate(0deg);}25%{transform:rotate(15deg);}50%{transform:rotate(0deg);}75%{transform:rotate(-12deg);}100%{transform:rotate(0deg);}}

  /* ===== ② 本 ===== */
  #lp-book{display:flex;align-items:flex-start;justify-content:center;}
  #lp-book .book-wrap{position:relative;flex-shrink:0;margin-top:20vh;}
  #lp-book .logo-img{display:block;}
  #lp-book.active .logo-img{animation:fromBelow 0.9s cubic-bezier(0.16,1,0.3,1) 0.05s forwards;}
  @keyframes fromBelow{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
  #lp-book .meta-top{top:44px;left:50%;transform:translateX(-50%);}
  #bookmark{position:absolute;top:-18px;right:18%;display:flex;flex-direction:column;align-items:center;transform-origin:top center;opacity:0;}
  #bookmark-ribbon{width:14px;background:var(--black);}
  #bookmark-tail{width:0;height:0;border-left:7px solid var(--black);border-right:7px solid var(--black);border-bottom:10px solid transparent;}
  @keyframes sway{0%{transform:rotate(0deg);}25%{transform:rotate(3deg);}50%{transform:rotate(0deg);}75%{transform:rotate(-3deg);}100%{transform:rotate(0deg);}}

  /* ===== ③ コード ===== */
  /* lp-sign/lp-bookと同じflex構造。margin-topでロゴの縦位置を調整 */
  #lp-code{display:flex;align-items:flex-start;justify-content:flex-start;}

  #lp-code .logo-img{
    margin-left:min(-4vw,-35px);  /* 左にはみ出す量 */
    margin-top:2vh;               /* ← 縦位置はここで調整 */
    width:min(48vw,520px);
    display:block;
    opacity:0;
  }
  #lp-code.active .logo-img{animation:fromLeft 0.9s cubic-bezier(0.16,1,0.3,1) 0.05s forwards;}
  @keyframes fromLeft{from{opacity:0;transform:translateX(-40px);}to{opacity:1;transform:translateX(0);}}

  /* メタ：右上 */
  #lp-code .meta-top{top:44px;right:44px;text-align:right;}

  /* コードエディタ：ロゴ直下に重ねる（absoluteで独立配置） */
  #code-editor{
    position:absolute;
    left:40px;                     /* ← 左端位置 */
    top:calc(-20vh + var(--logo-h, 120px) + 18px); /* ← margin-topと同じvh値に揃える */
    width:min(48vw,520px);
    font-family:'Share Tech Mono',monospace;
    font-size:clamp(9px,1vw,12px);
    color:var(--black);
    opacity:0;
    line-height:1.7;
    transition:opacity 0.4s ease;
    z-index:2;
  }
  #code-editor .line{display:flex;gap:12px;}
  #code-editor .ln{opacity:0.25;user-select:none;min-width:16px;text-align:right;}
  #code-editor .code-text{white-space:pre;}
  #code-editor .kw{opacity:0.5;}
  #code-editor .fn{opacity:0.85;}

  /* 波canvas：画面下半分 */
  #wave-canvas{
    position:absolute;
    bottom:0;left:0;
    width:100%;height:52vh;
    z-index:1;
    pointer-events:none;
  }

  /* navの背後の白四角：波より上（z:9）、navより下（z:10） */
  #nav-bg{
    position:absolute;
    bottom:65px;left:55px;
    width:125px;height:85px;
    background:var(--white);
    z-index:9;
    pointer-events:none;
  }
</style>
</head>

AAAACoBHQAAAAAAAAAqAR0AAAAAAAAAKgEdAAAAAAAAACoBHQAAAAAAAAAqAR0AAAAAAAAAKgEdAAAAAAAAACoBHQAAAAAAAAAqAR0AAAAAAAAAKgEdAAAAAAAAACoBHQAAAAAAAAAqAR0AAAAAAAAAKgEdAAAAAAAAACoBHQAAAAAAAAAqAR0AAAAAAAAAKgEdAAAAAAAAACoBHQAAAAAAAAAqAR0AAAAAAAAAKgEdAAAAAAAAACoBHQAAAAAAAAAqAR0AAAAAAAAAKgEdAAAAAAAAACoBHQAAAAAAAAAqAR0AAAAAAAAAKgEdAAAAAAAAACoBHQAAAAAAAAAqAR0AAAAAAAAAKgEdAAAAAAAAACoBHQAAAAAAAAAqAR0AAAAAAAAAKgEdAAAAAAAAACoBHQAAAAAAAAAqAR0AAAAAAAAAKgEdAAAAAAAAACoBHQAAAAAAAAAqAR0AAAAAAAAAKgEdAAAAAAAAACoBHQAAAAAAAAAqAR0AAAAAAAAAKgEdAAAAAAAAACoBHQAAAAAAAAAqAR0AAAAAAAAAKgEdAAAAAAAAACoBHQAAAAAAAAAqAR0AAAAAAAAAKgEdAAAAAAAAACoBHQAAAAAAAAAqAR0AAAAAAAAAKgEdAAAAAAAAACoBHQAAAAAAAAAqAR0AAAAAAAAAKgEdAAAAAAAAACoBHQAAAAAAAAAqAR0AAAAAAAAAKgEdAAAAAAAAACoBHQAAAAAAAAAqAR0AAAAAAAAAKgEdAAAAAAAAACoBHQAAAAAAAAAqAR0AAAAAAAAAKgEdAAAAAAAAACoBHQAAAAAAAAAqAR0AAAAAAAAAKgEdAAAAAAAAACoBHQAAAAAAAAAqAR0AAAAAAAAAKgEdAAAAAAAAACoBHQAAAAAAAAAqAR0AAAAAAAAAKgEdAAAAAAAAACoBHQAAAAAAAAAqAR0AAAAAAAAAKgEdAAAAAAAAACoBHQAAAAAAAACq+gtzSACoIFYsbgAAAABJRU5ErkJggg==" alt="Open Research Lab." id="code-logo">

<script>
  const lps = ['lp-sign','lp-book','lp-code'];
  const chosen = lps[Math.floor(Math.random()*lps.length)];
  document.getElementById(chosen).classList.add('active');

  /* ① 看板：鳥 */
  if (chosen === 'lp-sign') {
    const logoImg = document.querySelector('#lp-sign .logo-img');
    const birdWrap = document.getElementById('bird-wrap');
    const birdHead = document.getElementById('bird-head');
    const wingL = document.querySelector('.wing-left');
    const wingR = document.querySelector('.wing-right');
        logoImg.addEventListener('animationend', () => {
      // ===== 鳥の着地位置を数値で直接指定 =====
      const LAND_X = 100;  // logo-wrap左端からのpx（右に増やす）
      const LAND_Y = 158;   // logo-wrap上端からのpx（下に増やす）
      // =========================================
      const birdW = 56, birdH = 44;
      const wrapRect = logoImg.closest('.logo-wrap').getBoundingClientRect();

      const endX = LAND_X;
      const endY = LAND_Y;
      const startX = window.innerWidth / 2 - wrapRect.left;
      const startY = -wrapRect.top - birdH;
      const cpX = (startX+endX)/2 + (endX-startX)*0.3;
      const cpY = (startY+endY)/2 - 80;
      birdWrap.style.left=startX+'px'; birdWrap.style.top=startY+'px'; birdWrap.style.opacity='1';
      const dur=3200, t0=performance.now();
      function fly(now) { /* 以降同じ */
        const t=Math.min((now-t0)/dur,1), e=1-Math.pow(1-t,2.5);
        const x=Math.pow(1-e,2)*startX+2*(1-e)*e*cpX+Math.pow(e,2)*endX;
        const y=Math.pow(1-e,2)*startY+2*(1-e)*e*cpY+Math.pow(e,2)*endY;
        birdWrap.style.left=x+'px'; birdWrap.style.top=y+'px';
        if(t<1){requestAnimationFrame(fly);}
        else{
          wingL.style.animation='none'; wingR.style.animation='none';
          wingL.setAttribute('d','M8,10 Q6,10 6,11 Q7,11 8,10 Z');
          wingR.setAttribute('d','M8,10 Q10,10 10,11 Q9,11 8,10 Z');
          setTimeout(()=>{birdHead.style.transformOrigin='10.5px 8.5px';birdHead.style.animation='headTilt 1.8s ease-in-out infinite';},400);
        }
      }
      requestAnimationFrame(fly);
    },{once:true});
  }

  /* ② 本：栞 */
  if (chosen === 'lp-book') {
    const bookLogo = document.getElementById('book-logo');
    const bookWrap = document.querySelector('#lp-book .book-wrap');
     bookLogo.addEventListener('animationend', () => {
      // ===== 栞の位置（book-wrap左上基準のpx） =====
      const BM_X = -157;    // 右に増やす
      const BM_Y = 205;    // 上にはみ出す（マイナスでロゴより上）
      const BM_H = 80;     // リボンの長さ（px）
      // =============================================
      const bm = document.createElement('div'); bm.id='bookmark';
      const rb = document.createElement('div'); rb.id='bookmark-ribbon'; rb.style.height=BM_H+'px';
      const tl = document.createElement('div'); tl.id='bookmark-tail';
      bm.style.left=BM_X+'px'; bm.style.top=BM_Y+'px';
      bm.appendChild(rb); bm.appendChild(tl); bookWrap.appendChild(bm);
      setTimeout(()=>{bm.style.transition='opacity 0.6s ease';bm.style.opacity='1';},200);
      setTimeout(()=>{bm.style.animation='sway 3s ease-in-out infinite';},900);
    },{once:true});
  }

  /* ③ コード */
  if (chosen === 'lp-code') {
    const logoImg = document.getElementById('code-logo');
    const editor  = document.getElementById('code-editor');
    const waveCanvas = document.getElementById('wave-canvas');

    const codeLines = [
      {ln:'1',  kw:'const ', fn:'wave', rest:' = (x, t) =>'},
      {ln:'2',  kw:'  ', fn:'Math.sin', rest:'(x * freq + t) * amp'},
      {ln:'3',  kw:'', fn:'', rest:''},
      {ln:'4',  kw:'const ', fn:'layer1', rest:' = {'},
      {ln:'5',  kw:'  ', fn:'', rest:'baseY: 0.48, amp: 0.10,'},
      {ln:'6',  kw:'  ', fn:'', rest:'freq: 1.5, phase: 0'},
      {ln:'7',  kw:'', fn:'', rest:'}'},
      {ln:'8',  kw:'const ', fn:'layer2', rest:' = {'},
      {ln:'9',  kw:'  ', fn:'', rest:'baseY: 0.72, amp: 0.11,'},
      {ln:'10', kw:'  ', fn:'', rest:'freq: 1.3, phase: 0.8π'},
      {ln:'11', kw:'', fn:'', rest:'}'},
      {ln:'12', kw:'', fn:'', rest:''},
      {ln:'13', kw:'', fn:'render', rest:'([layer1, layer2])'},
    ];

    logoImg.addEventListener('animationend', () => {
      // ロゴの高さをCSS変数に
      document.documentElement.style.setProperty('--logo-h', logoImg.offsetHeight + 'px');
      editor.style.opacity = '1';

      let lineIdx = 0;
      function typeLine() {
        if (lineIdx >= codeLines.length) {
          setTimeout(() => {
            editor.style.opacity = '0';
            setTimeout(startWave, 600);
          }, 400);
          return;
        }
        const data = codeLines[lineIdx];
        const row = document.createElement('div');
        row.className = 'line';
        const ln = document.createElement('span');
        ln.className = 'ln'; ln.textContent = data.ln;
        const code = document.createElement('span');
        code.className = 'code-text';
        row.appendChild(ln); row.appendChild(code);
        editor.appendChild(row);
        lineIdx++;

        // 1文字ずつタイプ
        const fullText = (data.kw||'') + (data.fn||'') + (data.rest||'');
        const kwLen = (data.kw||'').length;
        const fnLen = (data.fn||'').length;
        let charIdx = 0;
        function typeChar() {
          if (charIdx >= fullText.length) {
            setTimeout(typeLine, data.rest===''? 80 : 60);
            return;
          }
          code.innerHTML = '';
          const kw = document.createElement('span'); kw.className='kw';
          kw.textContent = fullText.slice(0, Math.min(charIdx+1, kwLen));
          const fn = document.createElement('span'); fn.className='fn';
          fn.textContent = fullText.slice(kwLen, Math.min(charIdx+1, kwLen+fnLen));
          const rest = document.createTextNode(charIdx>=kwLen+fnLen ? fullText.slice(kwLen+fnLen,charIdx+1) : '');
          if(kw.textContent) code.appendChild(kw);
          if(fn.textContent) code.appendChild(fn);
          if(rest.textContent) code.appendChild(rest);
          charIdx++;
          setTimeout(typeChar, 18 + Math.random()*14);
        }
        typeChar();
      }
      setTimeout(typeLine, 300);
    }, {once:true});

    function startWave() {
  const waveCanvas = document.getElementById('wave-canvas');
  if (!waveCanvas) return;
  console.log('W:', waveCanvas.offsetWidth, 'H:', waveCanvas.offsetHeight);
  if (waveCanvas.offsetWidth === 0) {
    setTimeout(startWave, 100);
    return;
  }
  }
      const W = waveCanvas.offsetWidth;
      const H = waveCanvas.offsetHeight;
      waveCanvas.width  = W * devicePixelRatio;
      waveCanvas.height = H * devicePixelRatio;
      waveCanvas.style.width  = W + 'px';
      waveCanvas.style.height = H + 'px';
      const ctx = waveCanvas.getContext('2d');
      ctx.scale(devicePixelRatio, devicePixelRatio);

      const layers = [
        {
          fillColor:'#282422', lineColor:'#484240',
          baseY:H*0.38, amp:H*0.11,
          freq:2*Math.PI/W*1.3, phase:Math.PI*0.8,
          floatAmp:H*0.03, floatSpeed:0.3, floatPhase:Math.PI,
          lineSpacing:13, lineAmp:5, lineFreq:2*Math.PI/80,
        },
        {
          fillColor:'#ccc8c2', lineColor:'#9c9890',
          baseY:H*0.62, amp:H*0.10,
          freq:2*Math.PI/W*1.5, phase:0,
          floatAmp:H*0.035, floatSpeed:0.4, floatPhase:0,
          lineSpacing:13, lineAmp:5, lineFreq:2*Math.PI/80,
        },
      ];

      function getSurfaceY(layer, x, time) {
        return layer.baseY
          + Math.sin(layer.floatSpeed*time + layer.floatPhase)*layer.floatAmp
          + Math.sin(layer.freq*x + layer.phase + time*0.5)*layer.amp;
      }

      let revealProgress = 0;
      const revealDur = 1800;
      const revealStart = performance.now();
      let revealed = false;
      let t = 0;

      function drawLayer(layer, revealX, time) {
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(0, H);
        for (let x = 0; x <= revealX; x++) {
          ctx.lineTo(x, getSurfaceY(layer, x, time));
        }
        ctx.lineTo(revealX, H);
        ctx.closePath();
        ctx.fillStyle = layer.fillColor;
        ctx.fill();
        ctx.clip();
        for (let lineY = layer.lineSpacing; lineY < H; lineY += layer.lineSpacing) {
          ctx.beginPath();
          for (let x = 0; x <= revealX; x++) {
            const wy = lineY + Math.sin(layer.lineFreq * x + time * 0.9) * layer.lineAmp;
            x === 0 ? ctx.moveTo(x, wy) : ctx.lineTo(x, wy);
          }
          ctx.strokeStyle = layer.lineColor;
          ctx.lineWidth = 1.1;
          ctx.stroke();
        }
        ctx.restore();
      }

      function render(now) {
        ctx.clearRect(0,0,W,H);
        if (!revealed) {
          revealProgress = Math.min((now-revealStart)/revealDur, 1);
          if (revealProgress>=1) revealed=true;
        }
        const revealX = revealed ? W : revealProgress*W;
        layers.forEach(l => drawLayer(l, revealX, t));
        t += 0.016;
        requestAnimationFrame(render);
      }
      requestAnimationFrame(render);
    }
</script>
