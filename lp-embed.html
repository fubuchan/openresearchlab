<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open Research Lab.</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  :root { --black: #0a0a0a; --white: #f5f5f2; }

  html, body {
    width:100%; height:100%;
    overflow:hidden;
    background:var(--white);
    font-family:'Share Tech Mono', monospace;
  }

  .lp {
    position:absolute; inset:0;
    display:flex; align-items:flex-start;
    opacity:0; pointer-events:none;
  }
  .lp.active { opacity:1; pointer-events:all; }

  .logo-img {
    display:block;
    width:min(52vw,560px); height:auto;
    flex-shrink:0; opacity:0;
  }

  .meta {
    position:absolute;
    font-family:'Share Tech Mono',monospace;
    font-size:clamp(9px,0.9vw,11px);
    color:var(--black);
    letter-spacing:0.18em; text-transform:uppercase;
    opacity:0;
  }
  .lp.active .meta {
    animation:fadeUp 0.9s cubic-bezier(0.16,1,0.3,1) 0.5s forwards;
  }
  @keyframes fadeUp {
    from{opacity:0;transform:translateY(8px);}
    to{opacity:0.38;transform:translateY(0);}
  }

  .cursor {
    display:inline-block; width:0.55em; height:0.9em;
    background:var(--black); vertical-align:text-bottom;
    animation:blink 1s step-end infinite; margin-left:2px;
  }
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

  /* ナビゲーション */
  .nav {
    position:absolute; bottom:44px; left:44px;
    display:flex; flex-direction:column; gap:8px; z-index:10;
  }
  .nav a {
    font-family:'Share Tech Mono',monospace;
    font-size:clamp(9px,0.9vw,11px);
    letter-spacing:0.18em; text-transform:uppercase;
    color:var(--black); text-decoration:none;
    opacity:0; transition:opacity 0.2s ease;
  }
  .nav a:hover { opacity:1 !important; }
  .lp.active .nav a { animation:fadeUp 0.9s cubic-bezier(0.16,1,0.3,1) forwards; }
  .lp.active .nav a:nth-child(1){animation-delay:0.5s;}
  .lp.active .nav a:nth-child(2){animation-delay:0.6s;}
  .lp.active .nav a:nth-child(3){animation-delay:0.7s;}
  .lp.active .nav a:nth-child(4){animation-delay:0.8s;}

  /* ===== ① 看板 ===== */
  #lp-sign { justify-content:flex-end; }
  #lp-sign .logo-wrap {
    position:relative; flex-shrink:0;
    margin-right:min(-4vw,-40px); margin-top:35vh;
  }
  #lp-sign .logo-img { margin:0; }
  #lp-sign.active .logo-img {
    animation:fromRight 0.9s cubic-bezier(0.16,1,0.3,1) 0.05s forwards;
  }
  @keyframes fromRight {
    from{opacity:0;transform:translateX(40px);}
    to{opacity:1;transform:translateX(0);}
  }
  #lp-sign .meta-top { top:44px; left:44px; }

  /* 鳥 */
  #bird-wrap { position:absolute; opacity:0; }
  @keyframes flapLeft {
    0%{transform:rotate(-35deg);}50%{transform:rotate(20deg);}100%{transform:rotate(-35deg);}
  }
  @keyframes flapRight {
    0%{transform:rotate(35deg);}50%{transform:rotate(-20deg);}100%{transform:rotate(35deg);}
  }
  .wing-left  { transform-origin:8px 10px; animation:flapLeft  0.35s ease-in-out infinite; }
  .wing-right { transform-origin:8px 10px; animation:flapRight 0.35s ease-in-out infinite; }
  @keyframes headTilt {
    0%{transform:rotate(0deg);}25%{transform:rotate(15deg);}
    50%{transform:rotate(0deg);}75%{transform:rotate(-12deg);}100%{transform:rotate(0deg);}
  }

  /* ===== ② 本 ===== */
  #lp-book { justify-content:center; }
  #lp-book .book-wrap {
    position:relative; flex-shrink:0;
    margin-top:35vh;
    perspective:800px;
  }
  #lp-book .logo-img { display:block; }
  #lp-book.active .logo-img {
    animation:fromBelow 0.9s cubic-bezier(0.16,1,0.3,1) 0.05s forwards;
  }
  @keyframes fromBelow {
    from{opacity:0;transform:translateY(20px);}
    to{opacity:1;transform:translateY(0);}
  }
  #lp-book .meta-top { top:44px; left:50%; transform:translateX(-50%); }

  /* 栞 */
  #bookmark {
    position: absolute;
    top: -18px;
    right: 18%;
    width: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    transform-origin: top center;
    opacity: 0;
  }
  #bookmark-ribbon {
    width: 14px;
    background: var(--black);
    /* 高さはJSで設定 */
  }
  #bookmark-tail {
    width: 0;
    height: 0;
    border-left: 7px solid var(--black);
    border-right: 7px solid var(--black);
    border-bottom: 10px solid transparent;
  }
  @keyframes sway {
    0%   { transform: rotate(0deg); }
    25%  { transform: rotate(3deg); }
    50%  { transform: rotate(0deg); }
    75%  { transform: rotate(-3deg); }
    100% { transform: rotate(0deg); }
  }

  /* ===== ③ コード ===== */
  #lp-code { justify-content:flex-start; }
  #lp-code .logo-img {
    margin-left:min(-4vw,-40px); margin-top:35vh;
  }
  #lp-code.active .logo-img {
    animation:fromLeft 0.9s cubic-bezier(0.16,1,0.3,1) 0.05s forwards;
  }
  @keyframes fromLeft {
    from{opacity:0;transform:translateX(-40px);}
    to{opacity:1;transform:translateX(0);}
  }
  #lp-code .meta-top { top:44px; right:44px; text-align:right; }

  /* コードエディタ：ロゴ真下 */
  #code-editor {
    position:absolute;
    left: min(-4vw,-40px);
    top: calc(35vh + var(--logo-height, 120px) + 16px);
    width:min(52vw,560px);
    font-family:'Share Tech Mono',monospace;
    font-size:clamp(9px,1vw,12px);
    color:var(--black);
    opacity:0;
    line-height:1.7;
  }
  #code-editor .line { display:flex; gap:12px; }
  #code-editor .ln { opacity:0.25; user-select:none; min-width:16px; text-align:right; }
  #code-editor .code-text { white-space:pre; }
  #code-editor .kw  { opacity:0.5; }
  #code-editor .fn  { opacity:0.85; }
  #code-editor .str { opacity:0.6; }
  #code-editor .cm  { opacity:0.3; }

  /* SVG描画エリア：画面いっぱいの店舗ファサード */
  #code-drawing {
    position:absolute;
    inset: 0;
    opacity:0;
    transition:opacity 0.6s ease;
    pointer-events:none;
  }
  #code-drawing svg {
    width:100%; height:100%;
  }
  #code-drawing svg path,
  #code-drawing svg line,
  #code-drawing svg rect,
  #code-drawing svg polyline {
    stroke-dasharray: 2000;
    stroke-dashoffset: 2000;
  }
</style>
</head>
<body>

<!-- ① 看板 -->
<div class="lp" id="lp-sign">
  <div class="logo-wrap">
    <img class="logo-img" src="logo.png" alt="Open Research Lab.">
    <div id="bird-wrap">

  <div class="meta meta-top">Open Research Lab. — Est. 2025</div>
  <nav class="nav">
    <a href="#">Publication</a>
    <a href="#">About</a>
    <a href="#">Members</a>
    <a href="#">Action</a>

</div>

<!-- ② 本 -->
<div class="lp" id="lp-book">
  <div class="book-wrap">
    <img class="logo-img" src="logo.png" alt="Open Research Lab." id="book-logo">
    <!-- ページめくりレイヤー（JS で生成） -->
  </div>
  <div class="meta meta-top">Vol. ∞</div>
  <nav class="nav">
    <a href="#">Publication</a>
    <a href="#">About</a>
    <a href="#">Members</a>
    <a href="#">Action</a>
  </nav>
</div>

<!-- ③ コーディングソフト -->
<div class="lp" id="lp-code">
  <img class="logo-img" src="logo.png" alt="Open Research Lab.">
  <div class="meta meta-top">$ open research_lab --mode=public<span class="cursor"></span></div>
  <!-- コードエディタ -->
  <div id="code-editor"></div>
  <!-- 描画SVG：都市スカイライン -->
  <div id="code-drawing">
    <svg viewBox="0 0 300 160" preserveAspectRatio="xMidYMid slice" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- 地面ライン -->

      <!-- ビル群：左から右へ順番に描画 -->

      <polyline id="sk-b2" points="18,140 18,90 38,90 38,140" stroke="#0a0a0a" stroke-width="1.2"/>
      <!-- ビル3：細いアンテナ付き高層 -->
      <polyline id="sk-b3" points="35,140 35,60 50,60 50,140" stroke="#0a0a0a" stroke-width="1.2"/>
      <line id="sk-a3" x1="42" y1="60" x2="42" y2="48" stroke="#0a0a0a" stroke-width="0.8"/>

      <polyline id="sk-b4" points="48,140 48,95 72,95 72,140" stroke="#0a0a0a" stroke-width="1.2"/>
      <!-- ビル5：高層 -->
      <polyline id="sk-b5" points="69,140 69,50 84,50 84,140" stroke="#0a0a0a" stroke-width="1.2"/>
      <line id="sk-a5" x1="76" y1="50" x2="76" y2="38" stroke="#0a0a0a" stroke-width="0.8"/>
      <!-- ビル6：低め -->
      <polyline id="sk-b6" points="82,140 82,105 100,105 100,140" stroke="#0a0a0a" stroke-width="1.2"/>
      <!-- ビル7：最高層・中央 -->
      <polyline id="sk-b7" points="97,140 97,35 115,35 115,140" stroke="#0a0a0a" stroke-width="1.2"/>
      <line id="sk-a7" x1="106" y1="35" x2="106" y2="20" stroke="#0a0a0a" stroke-width="0.8"/>
      <!-- ビル8：中層 -->
      <polyline id="sk-b8" points="112,140 112,70 130,70 130,140" stroke="#0a0a0a" stroke-width="1.2"/>
      <!-- ビル9：幅広・低め -->
      <polyline id="sk-b9" points="127,140 127,100 155,100 155,140" stroke="#0a0a0a" stroke-width="1.2"/>
      <!-- ビル10：高層 -->
      <polyline id="sk-b10" points="152,140 152,55 168,55 168,140" stroke="#0a0a0a" stroke-width="1.2"/>
      <line id="sk-a10" x1="160" y1="55" x2="160" y2="42" stroke="#0a0a0a" stroke-width="0.8"/>
      <!-- ビル11：中層 -->
      <polyline id="sk-b11" points="165,140 165,80 182,80 182,140" stroke="#0a0a0a" stroke-width="1.2"/>
      <!-- ビル12：細い高層 -->
      <polyline id="sk-b12" points="179,140 179,60 192,60 192,140" stroke="#0a0a0a" stroke-width="1.2"/>
      <!-- ビル13：幅広・低め -->
      <polyline id="sk-b13" points="189,140 189,95 215,95 215,140" stroke="#0a0a0a" stroke-width="1.2"/>
      <!-- ビル14：高層 -->
      <polyline id="sk-b14" points="212,140 212,45 228,45 228,140" stroke="#0a0a0a" stroke-width="1.2"/>
      <line id="sk-a14" x1="220" y1="45" x2="220" y2="30" stroke="#0a0a0a" stroke-width="0.8"/>
      <!-- ビル15：中層 -->
      <polyline id="sk-b15" points="225,140 225,75 245,75 245,140" stroke="#0a0a0a" stroke-width="1.2"/>
      <!-- ビル16：低め -->
      <polyline id="sk-b16" points="242,140 242,108 260,108 260,140" stroke="#0a0a0a" stroke-width="1.2"/>
      <!-- ビル17：右端・中層 -->
      <polyline id="sk-b17" points="257,140 257,85 278,85 278,140" stroke="#0a0a0a" stroke-width="1.2"/>
      <!-- ビル18：右端・低め -->
      <polyline id="sk-b18" points="275,140 275,115 300,115 300,140" stroke="#0a0a0a" stroke-width="1.2"/>
      <!-- 窓ライン（いくつかのビルに） -->
      <line id="sk-w1" x1="38" y1="75"  x2="49" y2="75"  stroke="#0a0a0a" stroke-width="0.5"/>
      <line id="sk-w2" x1="38" y1="85"  x2="49" y2="85"  stroke="#0a0a0a" stroke-width="0.5"/>
      <line id="sk-w3" x1="70" y1="65"  x2="83" y2="65"  stroke="#0a0a0a" stroke-width="0.5"/>
      <line id="sk-w4" x1="70" y1="78"  x2="83" y2="78"  stroke="#0a0a0a" stroke-width="0.5"/>
      <line id="sk-w5" x1="98" y1="55"  x2="114" y2="55" stroke="#0a0a0a" stroke-width="0.5"/>
      <line id="sk-w6" x1="98" y1="68"  x2="114" y2="68" stroke="#0a0a0a" stroke-width="0.5"/>
      <line id="sk-w7" x1="98" y1="81"  x2="114" y2="81" stroke="#0a0a0a" stroke-width="0.5"/>
      <line id="sk-w8" x1="153" y1="70" x2="167" y2="70" stroke="#0a0a0a" stroke-width="0.5"/>
      <line id="sk-w9" x1="153" y1="83" x2="167" y2="83" stroke="#0a0a0a" stroke-width="0.5"/>
      <line id="sk-w10" x1="213" y1="60" x2="227" y2="60" stroke="#0a0a0a" stroke-width="0.5"/>
      <line id="sk-w11" x1="213" y1="73" x2="227" y2="73" stroke="#0a0a0a" stroke-width="0.5"/>
    </svg>
  </div>
  <nav class="nav">
    <a href="#">Publication</a>
    <a href="#">About</a>
    <a href="#">Members</a>
    <a href="#">Action</a>
  </nav>
</div>

<script>
  // ランダムLP選択
  const lps = ['lp-sign', 'lp-book', 'lp-code'];
  const chosen = lps[Math.floor(Math.random() * lps.length)];
  document.getElementById(chosen).classList.add('active');

  /* ===== ① 看板：鳥 ===== */
  if (chosen === 'lp-sign') {
    const logoImg  = document.querySelector('#lp-sign .logo-img');
    const birdWrap = document.getElementById('bird-wrap');
    const birdHead = document.getElementById('bird-head');
    const wingL    = document.querySelector('.wing-left');
    const wingR    = document.querySelector('.wing-right');

    logoImg.addEventListener('animationend', () => {
      const logoRect = logoImg.getBoundingClientRect();
      const wrapRect = logoImg.closest('.logo-wrap').getBoundingClientRect();
      const logoTopY   = logoRect.top  - wrapRect.top;
      const logoRightX = logoRect.right - wrapRect.left;
      const landX = logoRightX * 0.25;
      const landY = logoTopY;
      const birdW = 56, birdH = 44;
      const screenCenterX = window.innerWidth / 2 - wrapRect.left;
      const startX = screenCenterX;
      const startY = -wrapRect.top - birdH - 20;
      const endX = landX - birdW / 2;
      const endY = landY - birdH;
      const cpX = (startX + endX) / 2 + (endX - startX) * 0.3;
      const cpY = (startY + endY) / 2 - 80;

      birdWrap.style.left = startX + 'px';
      birdWrap.style.top  = startY + 'px';
      birdWrap.style.opacity = '1';

      const duration = 3200;
      const startTime = performance.now();

      function flyTo(now) {
        const t = Math.min((now - startTime) / duration, 1);
        const e = 1 - Math.pow(1 - t, 2.5);
        const x = Math.pow(1-e,2)*startX + 2*(1-e)*e*cpX + Math.pow(e,2)*endX;
        const y = Math.pow(1-e,2)*startY + 2*(1-e)*e*cpY + Math.pow(e,2)*endY;
        birdWrap.style.left = x + 'px';
        birdWrap.style.top  = y + 'px';
        if (t < 1) {
          requestAnimationFrame(flyTo);
        } else {
          wingL.style.animation = 'none';
          wingR.style.animation = 'none';
          wingL.setAttribute('d', 'M8,10 Q6,10 6,11 Q7,11 8,10 Z');
          wingR.setAttribute('d', 'M8,10 Q10,10 10,11 Q9,11 8,10 Z');
          setTimeout(() => {
            birdHead.style.transformOrigin = '10.5px 8.5px';
            birdHead.style.animation = 'headTilt 1.8s ease-in-out infinite';
          }, 400);
        }
      }
      requestAnimationFrame(flyTo);
    }, { once: true });
  }

  /* ===== ② 本：栞 ===== */
  if (chosen === 'lp-book') {
    const bookLogo = document.getElementById('book-logo');
    const bookWrap = document.querySelector('#lp-book .book-wrap');

    bookLogo.addEventListener('animationend', () => {
      const logoH = bookLogo.offsetHeight;

      // 栞を生成
      const bookmark = document.createElement('div');
      bookmark.id = 'bookmark';

      const ribbon = document.createElement('div');
      ribbon.id = 'bookmark-ribbon';
      // ロゴの高さの40%分だけ飛び出す
      ribbon.style.height = (logoH * 0.42) + 'px';

      const tail = document.createElement('div');
      tail.id = 'bookmark-tail';

      bookmark.appendChild(ribbon);
      bookmark.appendChild(tail);
      bookWrap.appendChild(bookmark);

      // フェードイン
      setTimeout(() => {
        bookmark.style.transition = 'opacity 0.6s ease';
        bookmark.style.opacity = '1';
      }, 200);

      // 風で揺れる
      setTimeout(() => {
        bookmark.style.animation = 'sway 3s ease-in-out infinite';
      }, 900);

    }, { once: true });
  }

  /* ===== ③ コード：タイピング＋SVG描画 ===== */
  if (chosen === 'lp-code') {
    const logoImg  = document.querySelector('#lp-code .logo-img');
    const editor   = document.getElementById('code-editor');
    const drawing  = document.getElementById('code-drawing');

    const lines = [
      { ln:'1',  kw:'const ', fn:'ground', rest:' = 140' },
      { ln:'2',  kw:'const ', fn:'city',   rest:' = []' },
      { ln:'3',  kw:'', fn:'', rest:'' },
      { ln:'4',  kw:'function ', fn:'building', rest:'(x, y, w) {' },
      { ln:'5',  kw:'  ', fn:'', rest:'// draw facade from ground' },
      { ln:'6',  kw:'  ', fn:'polyline', rest:'([x, ground, x, y,' },
      { ln:'7',  kw:'  ', fn:'', rest:'  x+w, y, x+w, ground])' },
      { ln:'8',  kw:'', fn:'', rest:'}' },
      { ln:'9',  kw:'', fn:'', rest:'' },
      { ln:'10', kw:'// ', fn:'', rest:'left district' },
      { ln:'11', kw:'', fn:'building', rest:'(35, 60, 15)' },
      { ln:'12', kw:'', fn:'building', rest:'(69, 50, 15)' },
      { ln:'13', kw:'// ', fn:'', rest:'center tower' },
      { ln:'14', kw:'', fn:'building', rest:'(97, 35, 18)' },
      { ln:'15', kw:'// ', fn:'', rest:'right district' },
      { ln:'16', kw:'', fn:'building', rest:'(212, 45, 16)' },
    ];

    logoImg.addEventListener('animationend', () => {
      // ロゴの高さをCSS変数に渡してエディタ位置を決定
      document.documentElement.style.setProperty('--logo-height', logoImg.offsetHeight + 'px');
      editor.style.opacity = '1';

      let lineIdx = 0;
      function typeLine() {
        if (lineIdx >= lines.length) {
          // 全行打ち終わったらSVG描画
          setTimeout(startDrawing, 400);
          return;
        }
        const data = lines[lineIdx];
        const row = document.createElement('div');
        row.className = 'line';

        const ln = document.createElement('span');
        ln.className = 'ln';
        ln.textContent = data.ln;

        const code = document.createElement('span');
        code.className = 'code-text';

        // キーワード部分
        if (data.kw) {
          const kw = document.createElement('span');
          kw.className = 'kw';
          kw.textContent = data.kw;
          code.appendChild(kw);
        }
        // 関数名部分
        if (data.fn) {
          const fn = document.createElement('span');
          fn.className = 'fn';
          fn.textContent = data.fn;
          code.appendChild(fn);
        }
        // 残り
        if (data.rest) {
          const rest = document.createTextNode(data.rest);
          code.appendChild(rest);
        }

        row.appendChild(ln);
        row.appendChild(code);
        editor.appendChild(row);
        lineIdx++;

        // 次の行へ
        setTimeout(typeLine, data.rest === '' ? 80 : 120 + Math.random() * 80);
      }
      setTimeout(typeLine, 300);
    }, { once: true });

    function startDrawing() {
      drawing.style.opacity = '1';
      const strokes = drawing.querySelectorAll('rect, line, path, polyline');
      strokes.forEach((el, i) => {
        let len = 2000;
        try { len = el.getTotalLength(); } catch(e) {}
        el.style.strokeDasharray  = len;
        el.style.strokeDashoffset = len;
        const dur = 0.5 + i * 0.08;
        const delay = i * 0.12;
        el.style.transition = `stroke-dashoffset ${dur}s ease ${delay}s`;
        requestAnimationFrame(() => requestAnimationFrame(() => {
          el.style.strokeDashoffset = '0';
        }));
      });
    }
  }
</script>
